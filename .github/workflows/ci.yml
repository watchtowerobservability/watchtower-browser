name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - name: Webpack fixture (no critical-dependency warnings, lazy chunks split)
        run: sh test/fixtures/webpack/run.sh
      - name: "Consumer fixtures (packed tarball: import, tsc skipLibCheck:false, next build)"
        run: sh test/fixtures/consumers.sh
